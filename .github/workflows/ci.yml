name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install pkg-config glfw
      - name: Check
        run: make clean && make check
      - name: Sanitize
        run: make sanitize
      - name: Package
        run: make package-check
