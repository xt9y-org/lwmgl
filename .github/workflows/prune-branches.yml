name: Prune stale branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete every branch except main
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "main" ] && continue
            echo "Deleting $branch"
            if ! git push origin --delete "$branch"; then
              failed=1
            fi
          done < <(git ls-remote --heads origin | awk '{print $2}' | sed 's#^refs/heads/##')
          exit "$failed"
